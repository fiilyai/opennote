# opennote 项目配置
#
# 这份配置默认接的是 KIMI Coding 端点（kimi-for-coding 模型）。
# clone 仓库 + pnpm install 之后 `pnpm dev` 即可直接对话，零配置。
#
# 下面 apiKey 是公开的测试 key，给读者快速跑通 demo 用。
# ⚠️ 请勿滥用、勿用于生产 / 大量请求。
# ⚠️ 自己实际使用时，请换成你自己的 KIMI key 或别的 provider key。
# ⚠️ 真生产 key 不要 commit 进 git。建议放 ~/.opennote/opennote.yaml（用户级）。
#
# 查找顺序：
#   1. opennote --config <path>
#   2. ./opennote.yaml（本文件，项目级）
#   3. ~/.opennote/opennote.yaml（用户级）
#   4. 都没有 → 用内置默认
#
# 所有字段都可选；不写就用默认值。

agent:
  # 走 pi-ai 内置 provider 时用 provider:model 形式（不写 provider 默认 anthropic）：
  #   anthropic:claude-sonnet-4-20250514
  #   openai:gpt-5
  #   google:gemini-2.5-pro
  #   moonshotai:kimi-k2.6           ← KIMI 海外版 (api.moonshot.ai)
  #   moonshotai-cn:kimi-k2.6        ← KIMI 国内版 (api.moonshot.cn)
  #   deepseek:deepseek-chat
  #
  # 走自定义 OpenAI 兼容端点时只写 model id（搭配下面的 baseUrl）：
  #   kimi-for-coding                ← KIMI Coding 端点
  model: kimi-for-coding #anthropic:claude-sonnet-4-20250514

  # 自定义 OpenAI 兼容端点（可选）。
  # 填了 baseUrl 就绕过 pi-ai 内置 provider 列表，直接用 OpenAI Chat Completions 协议。
  # 用于接：KIMI Coding、本地 vLLM、Ollama、第三方网关等。
  #
  baseUrl: https://api.kimi.com/coding/v1
  api: openai-completions           # 默认值，可省略

  # 自定义 HTTP headers（可选）。某些端点（KIMI Coding 等）按 User-Agent 白名单放行。
  # 写法（注意 yaml 缩进）：
  #
  headers:
    User-Agent: claude-cli/1.0 (Claude Code)

  # API key 怎么传给 Pi（三选一，按优先级）：
  #   1. apiKey: "sk-..."           ← 直接写值
  #   2. apiKeyEnv: NAME            ← 指定一个环境变量名，从 process.env 读
  #   3. 都不写                      ← 用 Pi 自带的默认 env 行为：
  #                                    anthropic   → ANTHROPIC_API_KEY
  #                                    moonshotai  → MOONSHOT_API_KEY
  #                                    openai      → OPENAI_API_KEY
  #                                    google      → GOOGLE_API_KEY
  #
  # ⚠️ 下面这是公开测试 key，请勿滥用。请换成你自己的 KIMI key（kimi.com 申请）。
  apiKey: "sk-kimi-71fR8E5lt3eL5wcYbyir6Oj9OoEgMqsIvhb9recg0LgP9UmLkMVEHsPxsgohn4Oz"
  # apiKeyEnv: KIMI_API_KEY

  # 系统提示词。Day 6 会教你怎么调这个。
  systemPrompt: |
    你是 opennote，帮快速记录、整理和回顾想法的 AI 笔记助手。
    - 收到链接时，先理解内容类型，再按合适的方式整理成笔记。
    - 直接动手，不解释你要做什么；完成后只报告结果。
    - 出错才说话。

# 运行时数据存哪。默认放在 ~/.opennote/ 下，跟着用户走，不跟着 git checkout。
paths:
  notes: ~/.opennote/notes
  proposals: ~/.opennote/proposals
  state: ~/.opennote/state

# Day 2-3 起加：parse-article、parse-youtube、parse-tweet、parse-paper
skills: []

# Day 5+ 加：weixin、prompt-tweak、compact-notes、composer-trigger 等
extensions: []

# Day 5 启用。Day 0 关着没事。
weixin:
  enabled: false
